<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.15; r: 3; } 50% { opacity: 0.6; r: 5; } }
    .dot { fill: #B6EC13; }
    .line { stroke: #B6EC13; stroke-width: 1; }

    .logo-mark path, .logo-mark rect, .logo-mark polygon { fill: #F5F5F5; }
    .logo-accent { fill: #B6EC13 !important; }

    /* word 1 "trade" typed one character at a time */
    .w1s1 { opacity: 0; animation: w1s1 10s steps(1) infinite; }
    @keyframes w1s1 { 0% {opacity:0} 4% {opacity:1} 5% {opacity:0} }
    .w1s2 { opacity: 0; animation: w1s2 10s steps(1) infinite; }
    @keyframes w1s2 { 0% {opacity:0} 5% {opacity:1} 6% {opacity:0} }
    .w1s3 { opacity: 0; animation: w1s3 10s steps(1) infinite; }
    @keyframes w1s3 { 0% {opacity:0} 6% {opacity:1} 7% {opacity:0} }
    .w1s4 { opacity: 0; animation: w1s4 10s steps(1) infinite; }
    @keyframes w1s4 { 0% {opacity:0} 7% {opacity:1} 8% {opacity:0} }
    .w1s5 { opacity: 0; animation: w1s5 10s steps(1) infinite; }
    @keyframes w1s5 { 0% {opacity:0} 8% {opacity:1} 85% {opacity:1} 90% {opacity:0} }

    .fade1 { opacity: 0; animation: fade1 10s steps(1) infinite; }
    @keyframes fade1 {
      0%, 8%   { opacity: 0; }
      10%, 85% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
    .prompt2 { opacity: 0; animation: promptFade2 10s steps(1) infinite; }
    @keyframes promptFade2 {
      0%, 15%  { opacity: 0; }
      17%, 85% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }

    /* word 2 "nature" typed one character at a time */
    .w2s1 { opacity: 0; animation: w2s1 10s steps(1) infinite; }
    @keyframes w2s1 { 0% {opacity:0} 20% {opacity:1} 21% {opacity:0} }
    .w2s2 { opacity: 0; animation: w2s2 10s steps(1) infinite; }
    @keyframes w2s2 { 0% {opacity:0} 21% {opacity:1} 22% {opacity:0} }
    .w2s3 { opacity: 0; animation: w2s3 10s steps(1) infinite; }
    @keyframes w2s3 { 0% {opacity:0} 22% {opacity:1} 23% {opacity:0} }
    .w2s4 { opacity: 0; animation: w2s4 10s steps(1) infinite; }
    @keyframes w2s4 { 0% {opacity:0} 23% {opacity:1} 24% {opacity:0} }
    .w2s5 { opacity: 0; animation: w2s5 10s steps(1) infinite; }
    @keyframes w2s5 { 0% {opacity:0} 24% {opacity:1} 25% {opacity:0} }
    .w2s6 { opacity: 0; animation: w2s6 10s steps(1) infinite; }
    @keyframes w2s6 { 0% {opacity:0} 25% {opacity:1} 85% {opacity:1} 90% {opacity:0} }

    .fade2 { opacity: 0; animation: fade2 10s steps(1) infinite; }
    @keyframes fade2 {
      0%, 29%  { opacity: 0; }
      30%, 85% { opacity: 1; }
      90%, 100% { opacity: 0; }
    }
  </style>

  <rect width="1200" height="300" fill="#0D0F13" />

  <!-- top edge network -->
  <g opacity="0.5">
    <line class="line" x1="60" y1="30" x2="130" y2="22" opacity="0.15" />
    <line class="line" x1="130" y1="22" x2="190" y2="34" opacity="0.15" />
    <line class="line" x1="480" y1="26" x2="540" y2="18" opacity="0.12" />
    <line class="line" x1="900" y1="24" x2="960" y2="32" opacity="0.12" />
    <line class="line" x1="960" y1="32" x2="1030" y2="20" opacity="0.12" />
    <circle class="dot" cx="60" cy="30" r="2.5" />
    <circle class="dot" cx="130" cy="22" r="2" />
    <circle class="dot" cx="190" cy="34" r="2.5" />
    <circle class="dot" cx="480" cy="26" r="2" />
    <circle class="dot" cx="540" cy="18" r="2.5" />
    <circle class="dot" cx="900" cy="24" r="2" />
    <circle class="dot" cx="960" cy="32" r="2.5" />
    <circle class="dot" cx="1030" cy="20" r="2" />
  </g>
  <circle class="pulse" cx="960" cy="32" r="3" fill="#EF4444" />

  <!-- bottom edge network -->
  <g opacity="0.5">
    <line class="line" x1="80" y1="272" x2="150" y2="280" opacity="0.15" />
    <line class="line" x1="150" y1="280" x2="220" y2="268" opacity="0.12" />
    <line class="line" x1="520" y1="276" x2="580" y2="266" opacity="0.12" />
    <line class="line" x1="960" y1="270" x2="1030" y2="280" opacity="0.12" />
    <line class="line" x1="1030" y1="280" x2="1100" y2="270" opacity="0.12" />
    <circle class="dot" cx="80" cy="272" r="2" />
    <circle class="dot" cx="150" cy="280" r="2.5" />
    <circle class="dot" cx="220" cy="268" r="2" />
    <circle class="dot" cx="520" cy="276" r="2" />
    <circle class="dot" cx="580" cy="266" r="2.5" />
    <circle class="dot" cx="960" cy="270" r="2" />
    <circle class="dot" cx="1030" cy="280" r="2.5" />
    <circle class="dot" cx="1100" cy="270" r="2" />
  </g>

  <!-- actual lovelock logo mark -->
  <g class="logo-mark" transform="translate(70,95) scale(0.115)">
    <path d="M2105.8,281.3c42.2,0,72.9,24.7,84.1,61.8h102.9c-15.1-90.3-91.1-157.2-187-157.2c-107.3,0-191.4,83.8-191.4,190.6
      c0,106.9,84.1,190.7,191.4,190.7c94.2,0,169.3-64.5,186.2-152.6h-103.5c-12.3,34.6-42.2,57.2-82.7,57.2c-53.9,0-93.1-40-93.1-95.3
      C2012.7,321.3,2051.9,281.3,2105.8,281.3z"/>
    <rect x="27.2" y="21.4" width="98.5" height="535.3"/>
    <polygon points="813.1,196.4 810.6,204.3 765.6,349.3 736.5,443.1 701.2,329.3 662.4,204.6 659.9,196.4 555.4,196.4 559.7,208.5
      681.7,546.3 685.4,556.7 787.5,556.7 791.1,546.9 913.4,208.9 918,196.4 "/>
    <rect x="1338.7" y="21.4" width="98.5" height="535.3"/>
    <polygon points="2680.7,556.7 2571,556.7 2566.4,549.9 2557.4,536.8 2448.2,375.8 2448.2,556.7 2349.8,556.7 2349.8,21.4
      2448.2,21.4 2448.2,375.4 2557.5,205.2 2563.1,196.5 2674.1,196.5 2666.7,207.7 2611.4,290.2 2553.6,376.7 2607.5,453 2672.5,545.2
      "/>
    <path d="M1099.3,490.4c-28,0-53.6-10.7-67.3-28.8H930.6c23,62.5,75.9,107.8,168.7,108.7c92.8-0.8,145.7-46.2,168.7-108.7h-101.4
      C1152.9,479.7,1127.3,490.4,1099.3,490.4z"/>
    <path d="M1279.1,343c-14.3-89.5-85.3-156-179.8-157.1c-94.5,1.1-165.5,67.6-179.8,157.1c-1.8,10.8-2.6,22-2.6,33.4
      c0,13,0.8,25.8,2.4,38.1h360.1c1.5-12.3,2.4-25.1,2.4-38.1C1281.7,365,1280.9,353.8,1279.1,343z M1012.5,343
      c10-47.2,42.5-71.5,86.8-71.5s76.9,24.2,86.8,71.5H1012.5z"/>
    <path d="M374,185.9c-107.3,0-191.4,84.5-191.4,192.1c0,107.8,84.1,192.2,191.4,192.2S565.4,485.8,565.4,378
      C565.4,270.4,481.3,185.9,374,185.9z M374,474c-53.9,0-93.1-40.3-93.1-96c0-55.5,39.2-96,93.1-96c53.9,0,92.9,40.4,92.9,96
      C466.9,433.7,427.9,474,374,474z"/>
    <path d="M1684.9,185.9c-107.3,0-191.4,84.5-191.4,192.1c0,107.8,84.1,192.2,191.4,192.2s191.4-84.5,191.4-192.2
      C1876.4,270.4,1792.3,185.9,1684.9,185.9z M1684.9,474c-53.9,0-93.1-40.3-93.1-96c0-55.5,39.2-96,93.1-96c53.9,0,92.9,40.4,92.9,96
      C1777.9,433.7,1738.8,474,1684.9,474z"/>
    <rect class="logo-accent" x="2674.1" y="21.4" width="98.5" height="175.1"/>
    <rect class="logo-accent" x="183" y="290.6" transform="matrix(-1.836970e-16 1 -1 -1.836970e-16 610.2999 145.9111)" width="98.5" height="175.1"/>
  </g>

  <!-- eyebrow tagline -->
  <text x="70" y="195" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="15" letter-spacing="4" fill="#B6EC13">
    BUILDING &amp; BREAKING THINGS
  </text>

  <!-- terminal window -->
  <rect x="650" y="55" width="500" height="190" fill="#16181D" stroke="#2A2E37" stroke-width="1" />
  <line x1="650" y1="97" x2="1150" y2="97" stroke="#2A2E37" stroke-width="1" />
  <circle cx="674" cy="76" r="5" fill="#FF5F56" />
  <circle cx="694" cy="76" r="5" fill="#FFBD2E" />
  <circle cx="714" cy="76" r="5" fill="#27C93F" />
  <text x="734" y="81" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8A8F98">jake@lovelock: ~</text>

  <!-- Q&A 1: trade -> creative -->
  <text x="668" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A8F98">jake@lovelock ~ %&#160;</text>
  <text class="w1s1" x="841" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">t▋</text>
  <text class="w1s2" x="841" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">tr▋</text>
  <text class="w1s3" x="841" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">tra▋</text>
  <text class="w1s4" x="841" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">trad▋</text>
  <text class="w1s5" x="841" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">trade▋</text>
  <text class="fade1" x="668" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#B6EC13">creative</text>

  <!-- Q&A 2: nature -> curious -->
  <text class="prompt2" x="668" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8A8F98">jake@lovelock ~ %&#160;</text>
  <text class="w2s1" x="841" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">n▋</text>
  <text class="w2s2" x="841" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">na▋</text>
  <text class="w2s3" x="841" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">nat▋</text>
  <text class="w2s4" x="841" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">natu▋</text>
  <text class="w2s5" x="841" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">natur▋</text>
  <text class="w2s6" x="841" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#F5F5F5">nature▋</text>
  <text class="fade2" x="668" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#B6EC13">curious</text>
</svg>
