<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.15; r: 3; } 50% { opacity: 0.6; r: 5; } }
    .dot { fill: #B6EC13; }
    .line { stroke: #B6EC13; stroke-width: 1; }
  </style>

  <rect width="1200" height="260" rx="16" fill="#0D0F13" />

  <!-- left-edge network -->
  <g opacity="0.55">
    <line class="line" x1="55" y1="45" x2="115" y2="80" opacity="0.18" />
    <line class="line" x1="115" y1="80" x2="45" y2="150" opacity="0.15" />
    <line class="line" x1="45" y1="150" x2="95" y2="208" opacity="0.15" />
    <line class="line" x1="95" y1="208" x2="150" y2="188" opacity="0.15" />
    <line class="line" x1="115" y1="80" x2="205" y2="58" opacity="0.12" />
    <circle class="dot" cx="55" cy="45" r="2.5" />
    <circle class="dot" cx="115" cy="80" r="3" />
    <circle class="dot" cx="45" cy="150" r="2.5" />
    <circle class="dot" cx="95" cy="208" r="2.5" />
    <circle class="dot" cx="150" cy="188" r="2" />
    <circle class="dot" cx="205" cy="58" r="2" />
  </g>

  <!-- right-edge network -->
  <g opacity="0.55">
    <line class="line" x1="1145" y1="50" x2="1085" y2="92" opacity="0.18" />
    <line class="line" x1="1085" y1="92" x2="1155" y2="158" opacity="0.15" />
    <line class="line" x1="1155" y1="158" x2="1098" y2="210" opacity="0.15" />
    <line class="line" x1="1085" y1="92" x2="1010" y2="62" opacity="0.12" />
    <line class="line" x1="1098" y1="210" x2="1000" y2="192" opacity="0.12" />
    <circle class="dot" cx="1145" cy="50" r="2.5" />
    <circle class="dot" cx="1085" cy="92" r="3" />
    <circle class="dot" cx="1155" cy="158" r="2.5" />
    <circle class="dot" cx="1098" cy="210" r="2.5" />
    <circle class="dot" cx="1010" cy="62" r="2" />
    <circle class="dot" cx="1000" cy="192" r="2" />
  </g>

  <!-- subtle threat-sim accent dot -->
  <circle class="pulse" cx="1085" cy="92" r="3" fill="#EF4444" />

  <!-- headline -->
  <text x="600" y="128" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="0.5" fill="#F5F5F5">
    JAKE LOVELOCK
  </text>

  <!-- eyebrow -->
  <text x="600" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="600" font-size="15" letter-spacing="4" fill="#B6EC13">
    BUILDING &amp; BREAKING THINGS
  </text>

  <!-- terminal corner detail -->
  <text x="40" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8A8F98">
    jake@lovelock ~ %<tspan fill="#B6EC13"> whoami</tspan>
  </text>
  <rect class="cursor" x="216" y="221" width="7" height="14" fill="#B6EC13" />
</svg>
